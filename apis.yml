name: AppNeta (Broadcom Software)
description: >-
  AppNeta is a network performance monitoring (NPM) platform, now part of Broadcom's
  Enterprise Software (IT Operations Management) portfolio, delivering continuous
  end-to-end visibility into application, network-path, and end-user experience across
  SaaS, cloud, and internet-facing environments. Distributed Monitoring Points run
  active synthetic tests (network path, web/HTTP, and browser-based experience) and
  stream metrics to the AppNeta SaaS platform. AppNeta exposes a token-authenticated
  REST API (v3 for Classic and v4 for Intelligent Alarms) for retrieving monitoring
  data, managing monitoring policies, provisioning Monitoring Points, and integrating
  performance telemetry into external observability and data pipelines.
