source: https://techdocs.broadcom.com/us/en/ca-enterprise-software/it-operations-management/appneta/GA/integrate/api.html
spec_type: Webhooks
summary: >-
  AppNeta exposes an outbound event surface. The v3 observer API supports event
  integration via webhook — AppNeta sends events to a server (or servers) of your
  choice for downstream processing. The v4 Intelligent Alarms API adds alarm connector
  endpoints that route alarm notifications to external systems. This is a webhook /
  push surface; AppNeta does not publish a formal AsyncAPI document.
delivery:
  transport: https-webhook
  direction: outbound
  consumer_hosted: true
surfaces:
  - name: observer-event-integration
    api_version: v3
    kind: webhook
    description: >-
      The observer API lets you configure event integration via webhook so AppNeta
      events are POSTed to an endpoint you control for custom processing.
    docs: https://techdocs.broadcom.com/us/en/ca-enterprise-software/it-operations-management/appneta/GA/integrate/api.html
  - name: alarm-connector
    api_version: v4
    kind: alarm-connector
    description: >-
      Intelligent Alarms alarm connector endpoints deliver high-severity alarm
      notifications to external ticketing, alerting, and automation tools. Alarms are
      generated by alarm rules (e.g. packet loss, degraded server response time).
    docs: https://techdocs.broadcom.com/us/en/ca-enterprise-software/it-operations-management/appneta/GA/integrate.html
notification_channels: [email, integration, snmp, webhook]
asyncapi_published: false
